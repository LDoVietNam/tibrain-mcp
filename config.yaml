# TiBrain Configuration
# API keys should be provided via environment variables:
# - MCP_HUB_API_KEY: MCP Hub API key
# - MCPPROXY_API_KEY: MCP Proxy API key
# - TIBRAIN_SECRET_KEY: Fallback encryption key

tibrain:
  port: 3005
  data_dir: "data"

cli_registry:
  enabled: true

handoff_tracking:
  enabled: true

skill_sync:
  enabled: false

mcp:
  public_name: "tibrain"
  public_mode: "sse"
  expose_upstream_tools: true
  compatibility: true
  internal_hub:
    enabled: true
    url: "http://localhost:3005"
  targets:
    filesystem: "builtin"
    fs: "builtin"
    git: "git-mcp"
    sqlite: "sqlite-mcp"
    postgres: "postgres-mcp"
    github: "github-mcp"
    obsidian: "obsidian-mcp-server"
    browser: "browser-extension"
    chrome-devtools: "chrome-devtools-mcp"

# ---------------------------------------------------------------------------
# MCP Gateway (remote MCP server exposed via Cloudflare Tunnel)
# Secrets MUST come from environment variables, never from this file.
#   TIBRAIN_MCP_BEARER_TOKEN  - bearer token for /mcp (required to connect)
#   TIBRAIN_AUTONOMY_MODE     - set to "trusted_full" ONLY with the preconditions below
# ---------------------------------------------------------------------------
  streamable_http_path: "/mcp"
  legacy_sse_path: "/mcp/sse"
  legacy_message_path: "/mcp/message"
  session_ttl: "30m"
  max_concurrent_calls_per_session: 4
  max_request_bytes: 1048576
  max_output_bytes: 4194304

server:
  host: "127.0.0.1"            # bind localhost only; Cloudflare Tunnel is the public ingress
  port: 3005
  public_base_url: "https://mcp.trepremium.online"

auth:
  mode: "bearer"
  bearer_token_env: "TIBRAIN_MCP_BEARER_TOKEN"
  allowed_origins:
    - "https://chatgpt.com"
    - "https://chat.openai.com"
  rate_limit_per_minute: 60

permissions:
  active_profile: "operator"   # fail-closed: read_only | operator | trusted_full
  trusted_full:
    enabled: false
    admin_identities: []        # populate with the ChatGPT/operator identity hashes
    filesystem_roots:
      - 'C:\'
      - 'Z:\'

audit:
  enabled: true
  path: ".runtime/logs/audit.jsonl"
  redact_secrets: true

allowed_roots:
  - "Z:\\02_CORE\\_cli\\.config"
  - "Z:\\01_PROJECTS\\apps\\extension"