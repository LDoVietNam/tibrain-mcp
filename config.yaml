# TiBrain Configuration
# API keys should be provided via environment variables:
# - MCP_HUB_API_KEY: MCP Hub API key
# - MCPPROXY_API_KEY: MCP Proxy API key
# - TIBRAIN_SECRET_KEY: Fallback encryption key
#
# For Termux Android, set TIBRAIN_BASE_DIR to the Termux home directory.

server:
  host: "0.0.0.0"
  port: 3005
  public_base_url: "http://localhost:3005"

data_dir: "Z:/03_DATA/tibrain-database"

cli_registry: "true"
handoff_tracking: "true"
skill_sync: "false"
index_knowledge: "false"

mcp:
  public_name: "tibrain"
  public_mode: "http"
  expose_upstream_tools: true
  compatibility: true
  streamable_http_path: "/mcp"
  legacy_sse_path: "/mcp/sse"
  legacy_message_path: "/mcp/message"
  session_ttl: "30m"
  max_concurrent_calls_per_session: 4
  max_request_bytes: 1048576
  max_output_bytes: 4194304
  servers:
    - name: "prompt-server-go"
      transport: "stdio"
      command: "go"
      args: ["run", "main.go"]
      env:
        CUSTOM_PROMPTS_DIR: "./prompts"
      enabled: false
    - name: "android-agent"
      transport: "stdio"
      command: "python"
      args: ["-m", "mcp_android"]
      env:
        ANDROID_UIAUTOMATOR2_PATH: "/data/data/com.android.uiautomator"
      enabled: true
      auto_start: true
    - name: "pocketmcp"
      transport: "http"
      url: "http://${POCKETMCP_HOST:-192.168.1.10}:8080/mcp"
      headers:
        X-API-Key: "${POCKETMCP_API_KEY}"
      # Tạm disable: Android device (POCKETMCP_HOST) thường không reachable trên LAN
      # → timeout ~20s x2 mỗi lần start TiBrain (connect + list tools).
      # Bật lại (enabled: true, auto_start: true) khi cần MCP trên điện thoại.
      enabled: false
      auto_start: false
    - name: "browser-mcp"
      transport: "stdio"
      command: "Z:/01_PROJECTS/apps/products/tibrain/bin/browser-cmd.exe"
      args: ["--mcp"]
      env:
        WS_PORT: "9001"
        HTTP_PORT: "9082"
        WS_TOKEN: "${BROWSER_MCP_WS_TOKEN}"
        JSSCRIPTS_PATH: "./resources/js_scripts"
        OBSERVATIONS_DIR: "${BROWSER_MCP_OBS_DIR}"
      # Tạm disable: bin/browser-cmd.exe không tương thích phiên bản Windows hiện tại
      # ("This version of %1 is not compatible with the version of Windows").
      # Bật lại sau khi thay binary browser-cmd.exe tương thích.
      enabled: false
      auto_start: false
    - name: "smartest-tv"
      transport: "stdio"
      command: "go"
      args: ["run", "main.go"]
      env:
        TV_DEVICE_PLATFORM: "android"
      enabled: false

auth:
  mode: "bearer"
  bearer_token_env: "TIBRAIN_MCP_BEARER_TOKEN"
  allowed_origins:
    - "http://localhost:3005"
    - "http://127.0.0.1:*"
  rate_limit_per_minute: 60

permissions:
  active_profile: "operator"
  trusted_full:
    enabled: false
    admin_identities: []
    filesystem_roots: []

audit:
  enabled: true
  path: ".runtime/logs/audit.jsonl"
  redact_secrets: true

allowed_roots:
  - "$HOME/.config/tibrain"
  - "$PWD"

# ============================================================================
# RAG Knowledge Indexing (chuẩn docs/RAG_STANDARD.md)
# - sources: các thư mục/file .md được index vào rag_documents khi TiBrain
#   khởi động. Idempotent: file không đổi (cùng content_hash) được skip.
# - Index thủ công: tibrain index --path <docs>
# - File .md phải có frontmatter chuẩn RAG (rag_id bắt buộc) mới được index.
# ============================================================================
rag:
  query_cache_ttl: "5m"
  query_cache_burst: 64
  sources:
    - path: "Z:/01_PROJECTS/apps/products/ti-agent/docs"
      description: "Tài liệu TiAgent (PC Assistant / Android Bridge)"
    # - path: "Z:/01_PROJECTS/apps/products/tirouter/docs"
    #   description: "Tài liệu TiRouter (CLIProxyAPI gateway)"
