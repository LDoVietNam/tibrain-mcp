# TiBrain - GitHub Actions CI workflow
# Multi-module: main repository + cli/ submodule
# Matches Makefile conventions: make test, make vet, make lint, make build, make docker
# Generated by ECC tooling

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

env:
  GO_VERSION: '1.25'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────────
  # Test job — runs go test with race detector and coverage
  # Matches: make test
  # ─────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.module == 'root' && '.' || 'cli' }}
    strategy:
      fail-fast: false
      matrix:
        module: [root, cli]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run tests
        run: go test -race -vet=off -cover ./...

  # ─────────────────────────────────────────────────────────────
  # Vet job — runs go vet
  # Matches: make vet
  # ─────────────────────────────────────────────────────────────
  vet:
    name: Vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.module == 'root' && '.' || 'cli' }}
    strategy:
      fail-fast: false
      matrix:
        module: [root, cli]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Run go vet
        run: go vet ./...

  # ─────────────────────────────────────────────────────────────
  # Lint job — golangci-lint using .golangci.yml
  # Matches: make lint
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint action
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: .
          only-new: false
      - name: golangci-lint action (cli)
        uses: golangci/golangci-lint-action@v6
        with:
          version: latest
          working-directory: cli
          only-new: false

  # ─────────────────────────────────────────────────────────────
  # Build job — go build for all packages + cmd/ti entry point
  # Matches: make build
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.module == 'root' && '.' || 'cli' }}
    strategy:
      fail-fast: false
      matrix:
        module: [root, cli]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go 1.25
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build all packages (to /dev/null)
        run: go build -o /dev/null ./...

      - name: Build cmd/ti entry point (root module only)
        if: matrix.module == 'root'
        run: go build -o /dev/null ./cmd/ti

  # ─────────────────────────────────────────────────────────────
  # Docker job — docker build using Dockerfile
  # Matches: make docker
  # ─────────────────────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

  # ─────────────────────────────────────────────────────────────
  # Cli Docker job — build cli/ as a standalone image
  # ─────────────────────────────────────────────────────────────
  cli-docker:
    name: Cli Docker Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker build (cli)
        uses: docker/build-push-action@v6
        with:
          context: cli
          file: cli/Dockerfile
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-cli:latest
        continue-on-error: true
