# Example TiBrain MCP Gateway configuration (NO real secrets).
# Copy to config.yaml and set TIBRAIN_MCP_BEARER_TOKEN in the environment.

server:
  host: "127.0.0.1"
  port: 3005
  public_base_url: "https://mcp.trepremium.online"

mcp:
  streamable_http_path: "/mcp"
  legacy_sse_path: "/mcp/sse"
  legacy_message_path: "/mcp/message"
  session_ttl: "30m"
  max_concurrent_calls_per_session: 4
  max_request_bytes: 1048576
  max_output_bytes: 4194304

auth:
  mode: "bearer"
  bearer_token_env: "TIBRAIN_MCP_BEARER_TOKEN"
  allowed_origins:
    - "https://chatgpt.com"
    - "https://chat.openai.com"
  rate_limit_per_minute: 60

permissions:
  active_profile: "operator"
  trusted_full:
    enabled: false
    admin_identities: []
    filesystem_roots:
      - 'C:\'
      - 'Z:\'

audit:
  enabled: true
  path: ".runtime/logs/audit.jsonl"
  redact_secrets: true

allowed_roots:
  - "Z:\\02_CORE\\_cli\\.config"
  - "Z:\\01_PROJECTS\\apps\\extension"

# ============================================================================
# RAG Knowledge Indexing (chuẩn docs/RAG_STANDARD.md)
# - sources: các thư mục/file .md được index vào rag_documents khi TiBrain
#   khởi động. Idempotent: file không đổi (cùng content_hash) được skip.
# - Index thủ công: tibrain index --path <docs>
# - File .md phải có frontmatter chuẩn RAG (rag_id bắt buộc) mới được index.
# ============================================================================
rag:
  query_cache_ttl: "5m"
  query_cache_burst: 64
  sources:
    - path: "Z:\\01_PROJECTS\\apps\\products\\ti-agent\\docs"
      description: "Tài liệu TiAgent (PC Assistant / Android Bridge)"
    # - path: "Z:\\01_PROJECTS\\apps\\products\\tirouter\\docs"
    #   description: "Tài liệu TiRouter (CLIProxyAPI gateway)"
